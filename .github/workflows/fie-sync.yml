name: FIE match (manual)

on:
  workflow_dispatch:   # run by hand; does not touch the live site

permissions:
  contents: write

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Match fencers to FIE
        run: python fie_sync.py
      - name: Save results to the repo
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add fie.json fie_review.txt
          git diff --cached --quiet || (git commit -m "FIE match $(date -u +%F)" && git push)
